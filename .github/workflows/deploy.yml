name: CI/CD Pipeline

# Triggers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  ###########################################################################
  # CI — run tests and checks on every push / PR
  ###########################################################################

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, zip, sqlite3, bcmath, intl, gd, fileinfo, pcntl, posix
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # FIX: Create .env file before generating key
      - name: Create .env file for CI
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "APP_ENV=testing" > .env
            echo "APP_DEBUG=true" >> .env
            echo "APP_URL=http://localhost" >> .env
          fi
          echo "APP_KEY=" >> .env

      # FIX: Now this will work because .env exists
      - name: Generate Laravel application key
        run: php artisan key:generate --force

      - name: Run test suite
        run: composer test

  ###########################################################################
  # Code style
  ###########################################################################

  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, zip, sqlite3, bcmath, intl, gd, fileinfo, pcntl, posix
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: ./vendor/bin/pint --test

  ###########################################################################
  # Build frontend assets
  ###########################################################################

  build-assets:
    name: Build frontend assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  ###########################################################################
  # CD — deploy to shared hosting over SFTP/SSH
  ###########################################################################

  deploy:
    name: Deploy to shared hosting
    runs-on: ubuntu-latest

    needs:
      - tests
      - lint
      - build-assets

    # Deploy only after a successful push to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment: production

    steps:
      - uses: actions/checkout@v4

      #######################################################################
      # PHP
      #######################################################################

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, zip, sqlite3, bcmath, intl, gd, fileinfo, pcntl, posix
          tools: composer

      #######################################################################
      # Node
      #######################################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      #######################################################################
      # Install production PHP dependencies
      #######################################################################

      - name: Install PHP dependencies (no dev)
        run: composer install --no-interaction --prefer-dist --no-dev --no-progress --optimize-autoloader

      #######################################################################
      # Build frontend assets
      #######################################################################

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      #######################################################################
      # Prepare deployment package
      #######################################################################

      - name: Prepare deployment package
        run: |
          cat > .rsync-exclude <<'EOF'
          .git
          .github
          .gitignore
          .editorconfig
          .vite
          node_modules
          tests
          scripts
          .env
          .env.*
          database/database.sqlite
          database/*.sqlite
          database/*.sqlite3
          storage/logs/*
          storage/framework/cache/data/*
          storage/framework/sessions/*
          storage/framework/views/*
          public/hot
          EOF

          mkdir -p staging

          rsync -a \
            --exclude-from=.rsync-exclude \
            ./ staging/

          rm .rsync-exclude

      #######################################################################
      # Put website into maintenance mode
      #######################################################################

      - name: Show maintenance mode
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            php artisan down --retry=60 || true

      #######################################################################
      # Upload files
      #######################################################################

      - name: Upload files over SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: staging/
          strip_components: 1
          target: ${{ secrets.SERVER_PATH }}

      #######################################################################
      # Run Laravel deployment commands
      #######################################################################

      - name: Run migrations, cache config, and bring site back up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            
            # Check if .env exists, if not, create from example
            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                cp .env.example .env
                php artisan key:generate --force
              else
                echo "⚠️ Warning: No .env file found and no .env.example available"
                echo "APP_ENV=production" > .env
                echo "APP_DEBUG=false" >> .env
                echo "APP_URL=${{ secrets.APP_URL }}" >> .env
                php artisan key:generate --force
              fi
            fi

            # Run database migrations
            php artisan migrate --force
            
            # Cache all configurations
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Clear old cache if needed
            php artisan cache:clear || true

            # Bring the site back up
            php artisan up